:"抓住了“先求面积、再乘单价”这条主线。"},{text:"求这块长方形空地的周长。",correct:!1,analysis:"把“面积”看成了“周长”，公式用错了。"},{text:"求这块空地的面积是多少平方米。",correct:!1,analysis:"只做了一半——题目问的是花多少钱，不是面积。"},{text:"求每平方米草坪多少钱。",correct:!1,analysis:"答非所问，单价题目已经给了。"}],tip:"先问自己：题目最后一句要的是“多少钱”，还是“多少平方米”？"},{id:"ma-mianji-2",subject:"math",category:"ma-mianji",grade:"四-六年级",difficulty:2,stem:"一个长方形花坛，长比宽多3米，宽是5米。要在花坛四周围一圈栅栏，栅栏长多少米？",keywords:[{text:"长比宽多3米",reason:"长要通过这个条件算出来",role:"condition"},{text:"宽是5米",reason:"已知数据",role:"data"},{text:"四周围一圈栅栏",reason:"是求周长，不是面积",role:"trap"}],options:[{text:"先求出长（5加3），再求长方形的周长。",correct:!0,analysis:"既算出了长，又认准了“围栅栏”是求周长。"},{text:"求花坛的面积是多少平方米。",correct:!1,analysis:"把周长看成了面积。"},{text:"只求花坛的长是多少米。",correct:!1,analysis:"只做了一步，题目要的是栅栏的长度。"},{text:"求花坛的长比宽多多少米。",correct:!1,analysis:"题目已经给了“多3米”。"}],tip:"“围一圈栅栏”是求周长；长要先用“比宽多3米”算出来。"},{id:"ma-danwei-1",subject:"math",category:"ma-danwei",grade:"四-六年级",difficulty:1,stem:"一根绳子长2米，剪去30厘米，还剩多少厘米？",keywords:[{text:"2米",reason:"单位是米，后面问的是厘米",role:"data"},{text:"剪去30厘米",reason:"要减去的是30厘米",role:"condition"},{text:"还剩多少厘米",reason:"问的是厘米，先要统一单位",role:"trap"}],options:[{text:"先把2米换成200厘米，再减去30厘米，求剩下的长度。",correct:!0,analysis:"注意到了单位要统一。"},{text:"直接用2减去30，得到答案。",correct:!1,analysis:"单位没统一就相减，这是最常见的陷阱。"},{text:"求剪去的30厘米占整根绳子的几分之几。",correct:!1,analysis:"答非所问，题目问的是还剩多少。"},{text:"求这根绳子一共有多少厘米。",correct:!1,analysis:"题目已经说了绳子长2米，问的是剩下多少。"}],tip:"注意单位！“还剩多少厘米”要求先统一单位再算。"},{id:"ma-danwei-2",subject:"math",category:"ma-danwei",grade:"四-六年级",difficulty:2,stem:"小华的身高是1米35厘米，他站在一个高4分米的凳子上，头顶离地面有多高？（用厘米作单位）",keywords:[{text:"1米35厘米",reason:"要化成厘米",role:"data"},{text:"4分米",reason:"也要化成厘米，是易漏的换算",role:"trap"},{text:"用厘米作单位",reason:"答案的单位要求",role:"condition"},{text:"头顶离地面有多高",reason:"要把两段高度加起来",role:"target"}],options:[{text:"先把1米35厘米和4分米都化成厘米，再把两段高度相加。",correct:!0,analysis:"两个单位都换算了，还认准了要相加。"},{text:"直接把1米35厘米加上4分米。",correct:!1,analysis:"单位没统一就相加。"},{text:"求小华比凳子高多少厘米。",correct:!1,analysis:"答非所问，题目问的是头顶离地面多高。"},{text:"只求小华的身高是多少厘米。",correct:!1,analysis:"只算了一部分，漏掉了
