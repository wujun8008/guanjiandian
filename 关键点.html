本文件是「关键点」题库的**唯一出题依据**。界面上的「生成题库」会把这份文件喂给 AI，
让它按这里的约定批量出题。**想调整 AI 的出题风格，改这个文件即可。**

题目分两种形态：

- **普通题**（大多数题型）：题干 + 4 个"这道题在问什么"的选项；
- **分组题**（数学「选知识点」、英语「判断句型」）：题干 + 若干"组"选项，每组多选或单选。

---

## 一、目标

题目只考察一件事：**孩子能不能读懂题干、抓住关键信息、看清这道题的结构。**
不考计算能力本身——考的是"读题"。

## 二、面向对象

中国**小学四到六年级**学生。

## 三、学科与题型

每个学科 5~6 个题型。出题时题型由调用方指定，必须严格符合该题型的定位。

| 学科 | 题型 | 定位 | 形态 |
|---|---|---|---|
| 语文 | 概括题 | 概括段意、主要内容、中心思想 | 普通题 |
| 语文 | 词句理解 | 理解词句在语境中的意思 | 普通题 |
| 语文 | 赏析题 | 品析修辞、写法、用词的好处 | 普通题 |
| 语文 | 按要求写句子 | 仿写、造句、句式变换 | 普通题 |
| 语文 | 古诗文 | 理解诗句、文言词句的意思 | 普通题 |
| 数学 | 购物问题 | 单价 × 数量，含优惠促销 | 普通题 |
| 数学 | 面积与周长 | 长方形、正方形的面积与周长 | 普通题 |
| 数学 | 单位换算 | 长度、质量、时间等单位的统一 | 普通题 |
| 数学 | 行程问题 | 速度、时间、路程的关系 | 普通题 |
| 数学 | 多步应用题 | 含"剩下""最多"等条件的多步题 | 普通题 |
| 数学 | **选知识点** | 判断一道题用到了哪些知识点 | **分组题** |
| 英语 | 疑问词理解 | Where / What / Who / When / How many… | 普通题 |
| 英语 | 句型要求 | 用指定句型写句子 | 普通题 |
| 英语 | 判断正误 | 按短文判断对错、改错 | 普通题 |
| 英语 | 词形填空 | 用单词的正确形式填空 | 普通题 |
| 英语 | 对话交际 | 选择应答、补全对话 | 普通题 |
| 英语 | **判断句型** | 分析一句话的句型、时态、单复数 | **分组题** |

## 四、难度

- **基础**：信息点少、干扰弱，一眼能看出关键。
- **进阶**：信息点多，含隐藏条件或容易看漏的陷阱。
- **挑战**：更长、更绕，必须先想清楚"问什么/什么结构"才能动手。
  分组题在挑战难度可以**多加几组**（层数更多）。

## 五、普通题的字段

1. **stem** —— 题干原文，20~60 字。
2. **keywords** —— 3~5 处关键信息：\`text\`（**必须与 stem 逐字一致**）、\`reason\`（20 字内）、
   \`role\`（\`task\`/\`object\`/\`data\`/\`condition\`/\`target\`/\`trap\`）。
3. **options** —— 4 个"这道题在问什么"的说法，**恰好 1 个正确**，另外 3 个是**近似干扰项**，
   分别对应看错范围 / 答非所问 / 只答一半 / 混淆概念。每项 \`{ text, correct, analysis }\`。
4. **tip** —— 一句话提示，30 字内。

## 六、分组题的字段

1. **stem** —— 题干（数学是一道题；英语是一句话）。
2. **groups** —— 若干组，每组：
   - \`label\`：组名（如"这道题用到的知识点""句型""时态"）；
   - \`multiple\`：\`true\` 多选 / \`false\` 单选；
   - \`options\`：选项文字（3~4 个，干扰项要像真的）；
   - \`correct\`：正确选项的**下标数组**（单选时只有 1 个）；
   - \`notes\`：与 \`options\` **一一对应**的逐项说明（可留空字符串）。
3. **tip** —— 一句话提示。

**「判断句型」的分层建议**（难度越高，组越多）：

- 基础：句型
- 进阶：句型 + 时态 + 三单
- 挑战：句型 + 时态 + 三单 + 单复数 + 可数不可数

各组的常用选项：

- 句型：主谓宾 / 主系表 / 存在句
- 时态：一般现在时 / 现在进行时 / 一般过去时 / 一般将来时
- 三单：是 / 否
- 单复数：单数 / 复数

### 答案必须分散（重要）

**同一批题里，正确答案不能老是同一个。**

- 「判断句型」的句型：主谓宾、主系表、存在句**三种都要出**，不能一连好几道都是存在句；
- \`correct\` 的下标要有变化，不要固定在同一个位置（比如老是 \`[2]\`）；

:"决定用长方形的面积公式",role:"object"},{text:"一共需要多少元",reason:"题目要的是总费用，不是面积",role:"target"}],options:[{text:"先求长方形空地的面积，再乘每平方米的价钱，求一共要花多少钱。",correct:!0,analysis:"抓住了“先求面积、再乘单价”这条主线。"},{text:"求这块长方形空地的周长。",correct:!1,analysis:"把“面积”看成了“周长”，公式用错了。"},{text:"求这块空地的面积是多少平方米。",correct:!1,analysis:"只做了一半——题目问的是花多少钱，不是面积。"},{text:"求每平方米草坪多少钱。",correct:!1,analysis:"答非所问，单价题目已经给了。"}],tip:"先问自己：题目最后一句要的是“多少钱”，还是“多少平方米”？"},{id:"ma-mianji-2",subject:"math",category:"ma-mianji",grade:"四-六年级",difficulty:2,stem:"一个长方形花坛，长比宽多3米，宽是5米。要在花坛四周围一圈栅栏，栅栏长多少米？",keywords:[{text:"长比宽多3米",reason:"长要通过这个条件算出来",role:"condition"},{text:"宽是5米",reason:"已知数据",role:"data"},{text:"四周围一圈栅栏",reason:"是求周长，不是面积",role:"trap"}],options:[{text:"先求出长（5加3），再求长方形的周长。",correct:!0,analysis:"既算出了长，又认准了“围栅栏”是求周长。"},{text:"求花坛的面积是多少平方米。",correct:!1,analysis:"把周长看成了面积。"},{text:"只求花坛的长是多少米。",correct:!1,analysis:"只做了一步，题目要的是栅栏的长度。"},{text:"求花坛的长比宽多多少米。",correct:!1,analysis:"题目已经给了“多3米”。"}],tip:"“围一圈栅栏”是求周长；长要先用“比宽多3米”算出来。"},{id:"ma-danwei-1",subject:"math",category:"ma-danwei",grade:"四-六年级",difficulty:1,stem:"一根绳子长2米，剪去30厘米，还剩多少厘米？",keywords:[{text:"2米",reason:"单位是米，后面问的是厘米",role:"data"},{text:"剪去30厘米",reason:"要减去的是30厘米",role:"condition"},{text:"还剩多少厘米",reason:"问的是厘米，先要统一单位",role:"trap"}],options:[{text:"先把2米换成200厘米，再减去30厘米，求剩下的长度。",correct:!0,analysis:"注意到了单位要统一。"},{text:"直接用2减去30，得到答案。",correct:!1,analysis:"单位没统一就相减，这是最常见的陷阱。"},{text:"求剪去的30厘米占整根绳子的几分之几。",correct:!1,analysis:"答非所问，题目问的是还剩多少。"},{text:"求这根绳子一共有多少厘米。",correct:!1,analysis:"题目已经说了绳子长2米，问的是剩下多少。"}],tip:"注意单位！“还剩多少厘米”要求先统一单位再算。"},{id:"ma-danwei-2",subject:"math",category:"ma-danwei",grade:"四-六年级",difficulty:2,stem:"小华的身高是1米35厘米，他站在一个高4分米的凳子上，头顶离地面有多高？（用厘米作单位）",keywords:[{text:"1米35厘米",reason:"要化成厘米",role:"data"},{text:"4分米",reason:"也要化成厘米，是易漏的换算",role:"trap"},{text:"用厘米作单位",reason:"答案的单位要求",role:"condition"},{text:"头顶离地面有多高",reason:"要把两段高度加起来",role:"target"}],options:[{text:"先把1米35厘米和4分米都化成厘米，再把两段高度相加。",correct:!0,analysis:"两个单位都换算了，还认准了要相加。"},{text:"直接把1米35厘米加上4分米。",correct:!1,analysis:"单位没统一就相加。"},{text:"求小华比凳子高多少厘米。",correct:!1,analysis:"答非所问，题目问的是头顶离地面多高。"},{text:"只求小华的身高是多少厘米。",correct:!1,analysis:"只算了一部分，漏掉了凳子的高度。"}],tip:"出现米、分米、厘米混在一起时，先都化成题目要求的单位再计算。"},{id:"ma-xingcheng-1",subject:"math",category:"ma-xingcheng",grade:"四-六年级",difficulty:1,stem:"一辆汽车每小时行60千米，行了3小时，一共行了多少千米？",keywords:[{text:"每小时行60千米",reason:"速度",role:"data"},{text:"行了3小时",reason:"时间",role:"data"},{text:"一共行了多少千米",reason:"求的是路程",role:"target"}],options:[{text:"求路程，用速度乘时间。",correct:!0,analysis:"认准了“一共行了多少千米”是求路程。"},{text:"求这辆汽车每小时行多少千米。",correct:!1,analysis:"速度题目已经给了。"},{text:"求行1千米需要多少小时。",correct:!1,analysis:"答非所问，题目求的是路程。"},{text:"求这辆汽车一共行了多少小时。",correct:!1,analysis:"问的是路程，不是时间。"}],tip:"“每小时行……”是速度，“行了……小时”是时间，求路程用速度乘时间。"},{id:"ma-xingcheng-2",subject:"math",category:"ma-xingcheng",grade:"四-六年级",difficulty:2,stem:"甲、乙两地相距240千米。一辆汽车从甲地出发，每小时行80千米，行驶2小时后，离乙地还有多少千米？",keywords:[{text:"相距240千米",reason:"总路程",role:"data"},{text:"每小时行80千米",reason:"速度",role:"data"},{text:"行驶2小时后",reason:"已经行了2小时",role:"condition"},{text:"离乙地还有多少千米",reason:"要用总路程减去已行的",role:"target"}],options:[{text:"先求2小时行的路程，再用总路程减去它。",correct:!0,analysis:"认准了“还有多少”要用总路程减已行的。"},{text:"求这辆汽车行完全程一共要几小时。",correct:!1,analysis:"答非所问，题目问的是还剩多少千米。"},{text:"求240千米里有几个80千米。",correct:!1,analysis:"虽然算了除法，但没回答“还有多少千米”。"},{text:"只求这辆汽车2小时行了多少千米。",correct:!1,analysis:"只做了一半，没算“还剩多少”。"}],tip:"“离……还有多少千米”，要用总路程减去已经行的，别只算出已经行的。"},{id:"ma-duobu-1",subject:"math",category:"ma-duobu",grade:"四-六年级",difficulty:1,stem:"小明有25元，买一本8元的笔记本后，剩下的钱最多能买几支3元的笔？",keywords:[{text:"买一本8元的笔记本后",reason:"要先减去笔记本的钱",role:"condition"},{text:"剩下的钱",reason:"用剩下的钱去买笔",role:"data"},{text:"最多",reason:"提示要考虑能不能正好整除",role:"condition"},{text:"几支3元的笔",reason:"要的是笔的支数",role:"target"}],options:[{text:"先减去买笔记本的钱，再用剩下的钱算最多能买几支笔。",correct:!0,analysis:"两步都想到了：先减、再除。"},{text:"求25元一共能买几支笔。",correct:!1,analysis:"漏掉了“买笔记本后”这个前提。"},{text:"求买完笔记本后还剩多少钱。",correct:!1,analysis:"只做了一半，题目问的是能买几支笔。"},{text:"求买一本笔记本和一支笔一共多少钱。",correct:!1,analysis:"答非所问，题目问的是笔
